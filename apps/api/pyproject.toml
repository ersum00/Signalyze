[project]
name = "signalyze-api"
version = "0.1.0"
description = "Signalyze API: computes and caches statistical Review Profiles. Never contacts Google."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "asyncpg>=0.29,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.3,<3",
    "slowapi>=0.1.9,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalyze_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# RUF001: the engine tests contain sample sentences in Greek, Cyrillic, CJK etc. whose letters
# are confusable with Latin ones by design.
"tests/*" = ["S", "B", "RUF001"]
# camelCase field names mirror the zod schemas / JSON data keys on purpose.
"signalyze_api/models.py" = ["N815"]
"signalyze_api/engine/data_files.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:signalyze_api.*"]
