# Bare-metal alternative (host nginx + certbot). NOT used on the current server,
# which fronts every project with a shared Caddy container (see deploy/caddy/ and
# docs/DEPLOY.md). Kept verbatim so a host-nginx server can be set up the same way:
#   cp deploy/nginx/signalyze.conf /etc/nginx/sites-available/signalyze
#   ln -s /etc/nginx/sites-available/signalyze /etc/nginx/sites-enabled/signalyze
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d signalyze.veriskor.com -d api.signalyze.veriskor.com
# Certbot appends the 443 server blocks.

server {
    listen 80;
    server_name signalyze.veriskor.com;
    root /var/www/signalyze;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}

server {
    listen 80;
    server_name api.signalyze.veriskor.com;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
