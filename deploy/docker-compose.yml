# =============================================================================
# Signalyze production stack (server pattern: each project has its own Postgres
# container; web/api containers join the shared `web-proxy` network that the
# koradar-caddy edge container proxies to; see deploy/caddy/signalyze.caddy).
#
#   cd /opt/signalyze && docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# =============================================================================
name: signalyze

services:
  db:
    image: postgres:16-alpine
    container_name: signalyze-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalyze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: signalyze
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U signalyze -d signalyze']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 192m

  api:
    image: signalyze-api:latest
    build:
      context: ../apps/api
    container_name: signalyze-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://signalyze:${POSTGRES_PASSWORD}@db:5432/signalyze
      EXTENSION_IDS: ${EXTENSION_IDS:?EXTENSION_IDS must be set in .env}
      PORT: '8090'
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    expose:
      - '8090'
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8090}:8090' # loopback only, for smoke tests
    networks:
      - default
      - web-proxy
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  web:
    image: signalyze-web:latest
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: signalyze-web
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - web-proxy
    mem_limit: 64m

volumes:
  pgdata:

networks:
  web-proxy:
    external: true
    name: web-proxy
